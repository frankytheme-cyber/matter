<!-- wp:matter/legal-page {"eyebrow":"Informativa","title":"Self Guarding","title-id":"self-guarding-title","intro":"Questa pagina descrive come Matter of Fitness tratta i dati personali raccolti tramite il sito, i moduli di contatto e i rapporti con soci e visitatori delle <a class=\"u-inline-link\" href=\"{{HOME}}/sedi/\">sedi di Pescantina e Bovolone</a>. Documenti correlati: <a class=\"u-inline-link\" href=\"{{HOME}}/privacy-policy/\">Privacy Policy</a> e <a class=\"u-inline-link\" href=\"{{HOME}}/cookie-policy/\">Cookie Policy</a>.","meta":"Ultimo aggiornamento: <time datetime=\"2026-05-12\">12 maggio 2026</time>.","sec1-heading":"Titolare del trattamento","sec1-body":"<p>Il titolare del trattamento è Matter of Fitness, con sedi operative a Settimo di Pescantina e a Bovolone, in provincia di Verona.</p><p>Per richieste relative alla privacy puoi scrivere a <a href=\"mailto:info@matteroffitness.it\">info@matteroffitness.it</a> o chiamare il <a href=\"tel:+393471610051\">+39 347 161 0051</a>.</p>","sec2-heading":"Dati trattati","sec2-body":"<p>Possiamo trattare dati identificativi e di contatto, ad esempio nome, cognome, indirizzo email, numero di telefono e messaggi inviati tramite i moduli del sito.</p><p>Durante la navigazione possono essere raccolti anche dati tecnici necessari al funzionamento del sito, come indirizzo IP, tipo di browser, sistema operativo e pagine visitate.</p>","sec3-heading":"Finalità del trattamento","sec3-body":"<p>I dati personali sono utilizzati per:</p><ul><li>rispondere a richieste di informazioni, visite o contatti ricevuti online;</li><li>gestire il rapporto con soci e utenti dei servizi offerti nelle sedi;</li><li>garantire sicurezza, manutenzione e corretto funzionamento del sito;</li><li>adempiere a obblighi di legge, fiscali o amministrativi quando richiesto.</li></ul>","sec4-heading":"Base giuridica e conservazione","sec4-body":"<p>Il trattamento si basa sul consenso espresso tramite i moduli del sito, sull'esecuzione di misure precontrattuali o contrattuali richieste dall'interessato e, quando necessario, sull'adempimento di obblighi legali.</p><p>I dati sono conservati per il tempo necessario a gestire la richiesta o il rapporto in corso e, successivamente, per i periodi previsti dalla normativa applicabile.</p>","sec5-heading":"Diritti delle persone interessate","sec5-body":"<p>In qualunque momento puoi chiedere l'accesso ai tuoi dati, la rettifica, la cancellazione, la limitazione del trattamento, la portabilità dei dati e opporti al trattamento nei casi previsti dal Regolamento UE 2016/679.</p><p>Hai inoltre diritto di proporre reclamo all'Autorità Garante per la protezione dei dati personali se ritieni che il trattamento violi la normativa vigente.</p>","sec6-heading":"Contatti","sec6-body":"<p>Per esercitare i tuoi diritti o per chiarimenti su questa informativa, contattaci tramite <a href=\"mailto:info@matteroffitness.it\">info@matteroffitness.it</a> oppure visita la pagina <a href=\"{{HOME}}/contatti/\">Contatti</a>.</p>"} /-->
